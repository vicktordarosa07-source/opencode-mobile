name: Build Android APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.3.13750724"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev gcc

      - name: Verify cc linker
        run: which cc && cc --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Add cargo to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: "true"

      - name: Install Android NDK
        run: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Install dependencies
        run: pnpm install

      - name: Fix Tauri project structure
        run: |
          # Tauri CLI expects Cargo.toml at root for android init
          # Our structure has it in src-tauri/, so we create symlinks
          ln -sf src-tauri/Cargo.toml Cargo.toml
          ln -sf src-tauri/build.rs build.rs
          # tauri-build expects tauri.conf.json in src-tauri/
          ln -sf ../tauri.conf.json src-tauri/tauri.conf.json
          # Verify structure
          ls -la Cargo.toml build.rs src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/src/lib.rs

      - name: Initialize Android
        run: pnpm tauri android init

      - name: Verify project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo ""
          echo "=== src-tauri ==="
          ls -la src-tauri/
          echo ""
          echo "=== Cargo.toml content ==="
          head -5 Cargo.toml

      - name: Verify NDK toolchain
        run: |
          NDK_HOME="${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          echo "NDK_HOME: $NDK_HOME"
          ls -la "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -20
          which aarch64-linux-android-clang || echo "clang not found in PATH"

      - name: Build APK
        run: |
          export NDK_HOME="${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          export ANDROID_NDK_ROOT="${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"
          export PATH="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin:${PATH}"
          export CARGO_TARGET_DIR="${{ github.workspace }}/src-tauri/target"
          pnpm tauri android build --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opencode-mobile-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opencode-mobile-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 30