name: Build Android APK

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.3.13750724"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Install dependencies
        run: pnpm install

      - name: Fix Tauri project structure
        run: |
          # Tauri CLI expects Cargo.toml at root for android init
          # Our structure has it in src-tauri/, so we create a symlink
          ln -sf src-tauri/Cargo.toml Cargo.toml
          ln -sf src-tauri/build.rs build.rs
          ls -la Cargo.toml build.rs

      - name: Initialize Android
        run: pnpm tauri android init

      - name: Verify project structure
        run: |
          echo "=== Project root ==="
          ls -la
          echo ""
          echo "=== src-tauri ==="
          ls -la src-tauri/
          echo ""
          echo "=== Cargo.toml content ==="
          head -5 Cargo.toml

      - name: Build APK
        run: pnpm tauri android build --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opencode-mobile-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opencode-mobile-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
