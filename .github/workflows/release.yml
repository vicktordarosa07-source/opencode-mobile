name: Release Android

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.3.13750724"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Install dependencies
        run: pnpm install

      - name: Fix Tauri project structure
        run: |
          ln -sf src-tauri/Cargo.toml Cargo.toml
          ln -sf src-tauri/build.rs build.rs
          ln -sf ../tauri.conf.json src-tauri/tauri.conf.json

      - name: Initialize Android
        run: pnpm tauri android init

      - name: Build APK
        run: |
          ln -sf ../dist src-tauri/dist
          pnpm tauri android build --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opencode-mobile-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 90

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: opencode-mobile-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: opencode-mobile-apk
          path: ./release

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: opencode-mobile-aab
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenCode Mobile ${{ github.ref_name }}"
          body: |
            ## OpenCode Mobile ${{ github.ref_name }}

            Built from commit ${{ github.sha }}

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" on your Android device
            3. Open the APK file to install

            ### Play Store
            Use the AAB file for Play Store submission.
          files: |
            ./release/**/*.apk
            ./release/**/*.aab
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
